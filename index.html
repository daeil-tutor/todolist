<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskMaster</title>
  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
</head>
<body class="app">

  <!-- ── Sidebar ──────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__logo">
      <div class="sidebar__logo-icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 2l2.09 4.26L17 7.27l-3.5 3.41.83 4.82L10 13.27l-4.33 2.23.83-4.82L3 7.27l4.91-1.01L10 2z"
                fill="currentColor"/>
        </svg>
      </div>
      <span class="sidebar__logo-text">TaskMaster</span>
    </div>

    <!-- Nav Links -->
    <nav class="sidebar__nav" id="sidebar-nav">
      <button class="sidebar__link sidebar__link--active" data-nav="today" type="button">
        <svg class="sidebar__link-icon" width="18" height="20" viewBox="0 0 18 20" fill="none" aria-hidden="true">
          <rect x="1" y="3" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M1 8h16" stroke="currentColor" stroke-width="1.5"/>
          <path d="M5 1v4M13 1v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Today</span>
      </button>
      <button class="sidebar__link" data-nav="upcoming" type="button">
        <svg class="sidebar__link-icon" width="20" height="18" viewBox="0 0 20 18" fill="none" aria-hidden="true">
          <path d="M10 1l2.39 4.84L18 6.88l-4 3.9.94 5.5L10 13.77l-4.94 2.5.94-5.5-4-3.9 5.61-1.04L10 1z"
                stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <span>Upcoming</span>
      </button>
      <button class="sidebar__link" data-nav="completed" type="button">
        <svg class="sidebar__link-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M4 10l4 4 8-8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>Completed</span>
      </button>

      <!-- Projects Section -->
      <div class="sidebar__section-label">Projects</div>
      <div id="sidebar-projects"></div>
    </nav>

    <!-- Bottom: Settings + User -->
    <div class="sidebar__bottom">
      <div class="sidebar__bottom-links">
        <button class="sidebar__link" type="button">
          <svg class="sidebar__link-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.93 3.93l1.41 1.41M14.66 14.66l1.41 1.41M3.93 16.07l1.41-1.41M14.66 5.34l1.41-1.41"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Settings</span>
        </button>
      </div>
      <div class="sidebar__user">
        <div class="sidebar__avatar">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2 18c0-3.31 3.58-6 8-6s8 2.69 8 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="sidebar__user-info">
          <span class="sidebar__user-name">사용자</span>
          <span class="sidebar__user-role">Pro Account</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── Main Content Area ────────────────────────────────── -->
  <div class="main-area">

    <!-- Top Header / Quick Add -->
    <header class="top-header">
      <div class="top-header__input-wrap">
        <svg class="top-header__input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 7v6M7 10h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input
          type="text"
          class="top-header__input"
          id="task-input"
          placeholder="새 작업 추가 (예: 'PR 검토' @높은 우선순위)"
          aria-label="할 일 입력"
          autocomplete="off"
          maxlength="200"
        />
      </div>
      <div class="top-header__actions">
        <button class="top-header__icon-btn" id="btn-notification" type="button" aria-label="알림">
          <svg width="16" height="20" viewBox="0 0 16 20" fill="none" aria-hidden="true">
            <path d="M8 1a5 5 0 00-5 5v4l-2 3h14l-2-3V6a5 5 0 00-5-5zM6 16a2 2 0 004 0"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="top-header__new-project-btn" id="btn-add" type="button">
          <svg width="8" height="8" viewBox="0 0 8 8" fill="none" aria-hidden="true">
            <path d="M4 0v8M0 4h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Add Task</span>
        </button>
      </div>
    </header>

    <!-- Scrollable Content -->
    <main class="content" id="content">
      <div class="content__header">
        <h1 class="content__title">Today's Task</h1>
        <p class="content__date" id="content-date"></p>
      </div>

      <!-- Add Task Form -->
      <div class="add-task-form" id="add-task-form">
        <div class="add-task-form__row">
          <select class="add-task-form__select" id="category-select" aria-label="카테고리 선택">
            <option value="">카테고리</option>
          </select>
          <select class="add-task-form__select" id="priority-select" aria-label="우선순위 선택">
            <option value="high">높은 우선순위</option>
            <option value="medium">중간 순위</option>
            <option value="low">낮은 순위</option>
          </select>
        </div>
      </div>

      <!-- Task sections rendered by JS -->
      <div id="todo-container" class="todo-container"></div>
    </main>
  </div>

  <!-- ── Right Side Panel ─────────────────────────────────── -->
  <aside class="right-panel" id="right-panel">
    <div class="right-panel__header">
      <h2 class="right-panel__title">Project</h2>
    </div>
    <div class="right-panel__body">
      <!-- Progress Bars (rendered by JS) -->
      <div id="progress-section" class="progress-section"></div>

      <!-- Upcoming Deadline Card -->
      <div class="deadline-card" id="deadline-card">
        <h3 class="deadline-card__title">Upcoming Deadline</h3>
        <p class="deadline-card__desc" id="deadline-desc">다음 마감일이 없습니다.</p>
        <button class="deadline-card__btn" type="button">View Schedule</button>
      </div>

      <!-- Recent Activity -->
      <div class="activity-section">
        <h4 class="activity-section__label">Recent Activity</h4>
        <div id="activity-list" class="activity-list"></div>
      </div>
    </div>
  </aside>

  <!-- ── Mobile overlay ───────────────────────────────────── -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- ── Mobile hamburger (hidden on desktop) ─────────────── -->
  <button class="mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="메뉴 열기">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
